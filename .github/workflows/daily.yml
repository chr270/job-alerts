name: Veille quotidienne

on:
  schedule:
    # GitHub retarde ou saute parfois les lancements programmés, surtout pile à l'heure ronde.
    # Trois passages décalés, à des minutes creuses : si le premier saute, un suivant rattrape.
    # Sans risque de doublon : le script ne mail que les offres pas encore en archive.
    - cron: "17 4 * * *" # 05:17 à Paris l'hiver, 06:17 l'été
    - cron: "47 5 * * *" # 06:47 l'hiver, 07:47 l'été
    - cron: "23 8 * * *" # 09:23 l'hiver, 10:23 l'été
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Récupérer les offres, mettre à jour la page, envoyer le mail
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_TO }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TZ: Europe/Paris
        run: python run.py
      - name: Enregistrer l'état et la page
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || (git commit -m "Mise à jour $(date +%F)" && git push)
