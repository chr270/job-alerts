<style>

  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--txt); }

  .wrap { overflow-x:auto; padding:0 14px 40px; }
  table { border-collapse:collapse; width:100%; min-width:880px; background:var(--card); margin-top:10px; border:1px solid var(--bd); }
  th,td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--bd); vertical-align:top; }
  th { background:var(--card); cursor:pointer; white-space:nowrap; font-size:12px; color:var(--mut); user-select:none; }

  tr.o:hover { background:var(--row); }
  tr.off td { opacity:.55; }

  a.t { color:var(--acc); font-weight:600; text-decoration:none; }
  a.t:hover { text-decoration:underline; }

  .new { color:var(--new); border-color:var(--new); font-weight:700; }
  .note { color:var(--mut); font-size:12px; margin-top:3px; }
  td.kw { max-width:240px; }
  .empty { text-align:center; color:var(--mut); padding:40px 0; }

const NEW_DAYS = 2;
const TODAY = "2026-11-12";
const $ = id => document.getElementById(id);
const days = d => (new Date(TODAY + "T00:00:00") - new Date(d + "T00:00:00")) / 864e5;
const isNew = o => days(o.first_seen) < NEW_DAYS;
const isOn = o => o.last_seen === TODAY;
const pubDate = o => o.published || o.first_seen;
const KEY = "suivi-offres";
let mine = {}; try { mine = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
let sortK = "score", sortDir = -1;

function fill(sel, key) {
  [...new Set(OFFERS.map(o => o[key]).filter(Boolean))].sort().forEach(v => {
    const op = document.createElement("option"); op.value = v; op.textContent = v; $(sel).appendChild(op);
  });
}
fill("src", "source"); fill("ctr", "contract");

function cell(tr, text, cls) { const td = document.createElement("td"); if (cls) td.className = cls; td.textContent = text || ""; tr.appendChild(td); return td; }

function render() {
  const q = $("q").value.toLowerCase().trim(), min = +$("min").value, st = $("stat").value, m = $("mine").value;
  let rows = OFFERS.filter(o =>
    o.score >= min &&
    (!q || [o.title, o.company, o.location, (o.keywords || []).join(" "), o.snippet].join(" ").toLowerCase().includes(q)) &&
    (!$("src").value || o.source === $("src").value) &&
    (!$("ctr").value || o.contract === $("ctr").value) &&
    (!st || (st === "on") === isOn(o)) &&
    (!m || (m === "none" ? !mine[o.id] : mine[o.id] === m)) &&
    (!$("when").value || days(pubDate(o)) <= +$("when").value) &&
    (!$("since").value || pubDate(o) >= $("since").value) &&
    (!$("onlytarget").checked || o.target) &&
    (!$("onlynew").checked || isNew(o)));
  rows.sort((a, b) => {
    const x = a[sortK] ?? "", y = b[sortK] ?? "";
    const c = typeof x === "number" ? x - y : String(x).localeCompare(String(y));
    return (c || (b.score - a.score)) * sortDir;
  });
  $("count").textContent = "· " + rows.length + " affichées / " + OFFERS.length + " en archive";
  document.querySelectorAll("th").forEach(th => th.classList.toggle("on", th.dataset.k === sortK));
  const body = $("body"); body.textContent = "";
  $("empty").hidden = rows.length > 0;
  rows.slice(0, 600).forEach(o => {
    const tr = document.createElement("tr");
    tr.className = "o" + (isOn(o) ? "" : " off") + (mine[o.id] === "ecarte" ? " skip" : "");
    const s = cell(tr, "", ""); const b = document.createElement("span");
    b.className = "sc s" + (o.score >= 70 ? 3 : o.score >= 50 ? 2 : o.score >= 35 ? 1 : 0); b.textContent = o.score; s.appendChild(b);
    const t = cell(tr, "", ""); const a = document.createElement("a");
    a.className = "t"; a.href = o.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = o.title; t.appendChild(a);
    if (isNew(o)) { const n = document.createElement("span"); n.className = "tag new"; n.textContent = "Nouveau"; t.append(" ", n); }
    if (!isOn(o)) { const n = document.createElement("span"); n.className = "tag"; n.textContent = "archivée"; t.append(" ", n); }
    if (o.note) { const n = document.createElement("div"); n.className = "note"; n.textContent = "🤖 " + o.note; t.appendChild(n); }
    cell(tr, (o.target ? "⭐ " : "") + o.company); cell(tr, o.location); cell(tr, [o.contract, o.remote].filter(Boolean).join(" · "));
    cell(tr, o.published); cell(tr, o.source);
    const k = cell(tr, "", "kw");
    (o.keywords || []).forEach(w => { const g = document.createElement("span"); g.className = "tag"; g.textContent = w; k.appendChild(g); });
    const sel = document.createElement("select");
    [["", "—"], ["interesse", "⭐ Intéressé"], ["postule", "✅ Postulé"], ["ecarte", "🚫 Écarté"]].forEach(([v, l]) => {
      const op = document.createElement("option"); op.value = v; op.textContent = l; sel.appendChild(op); });
    sel.value = mine[o.id] || "";
    sel.addEventListener("change", () => { if (sel.value) mine[o.id] = sel.value; else delete mine[o.id];
      localStorage.setItem(KEY, JSON.stringify(mine)); render(); });
    const sc = document.createElement("td"); sc.appendChild(sel); tr.appendChild(sc);
    body.appendChild(tr);
  });
}
document.querySelectorAll("th[data-k]").forEach(th => th.addEventListener("click", () => {
  const k = th.dataset.k; if (sortK === k) sortDir = -sortDir; else { sortK = k; sortDir = (k === "score" || k === "published") ? -1 : 1; } render(); }));
["q","min","src","ctr","stat","mine","when","since","onlytarget","onlynew"].forEach(id => $(id).addEventListener("input", render));
render();
</script>
